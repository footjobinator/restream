<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .player-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .player-shell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="player-shell">
      <iframe
        src="https://live.vkvideo.ru/app/embed/awayukira?autoplay=true&muted=true&stream_btn=false"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        sandbox="allow-scripts allow-same-origin allow-forms"
      ></iframe>
    </section>
  </main>
</body>
</html>
